name: Epistemic Digest

concurrency:
  group: epistemic-digest
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send epistemic digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/epistemic_digest.py

      - name: Run self-correction advisor
        run: python3 scripts/self_correct.py

      - name: Publish graph snapshot to docs
        run: |
          if [ -f data/graph_snapshot.json ]; then
            cp data/graph_snapshot.json docs/graph_snapshot.json
          fi

      - name: Persist digest history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "VolatiAI Bot"
          git config user.email "bot@volatiai.local"
          git add data/digest_history.json data/graph_snapshot.json docs/graph_snapshot.json docs/briefing.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update digest history and graph snapshot [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "pushed on attempt $i"
                exit 0
              fi
              echo "push rejected (attempt $i), rebasing and retrying..."
              git pull --rebase -X ours origin main
              sleep 3
            done
            echo "push failed after 5 attempts"
            exit 1
          fi
