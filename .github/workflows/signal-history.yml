name: signal-history
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: volatiai-main-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan for new signals
        run: python3 signal_history.py
      - name: Commit new events
        run: |
          git config user.name "signal-history-bot"
          git config user.email "bot@volatiai.local"
          git add reports/signal_history.jsonl reports/.signal_state.json
          if ! git diff --staged --quiet; then
            git commit -m "signal-history: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "no changes"
          fi
