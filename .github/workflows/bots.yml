name: VolatiAI Bots

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: volatiai-bots
  cancel-in-progress: true

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Add src to PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/src" >> $GITHUB_ENV

      - name: Run VolatiAI Engine
        run: python3 -m src.main

      - name: Persist briefing
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/briefing.json
          if git diff --staged --quiet; then
            echo "no changes to briefing.json"
            exit 0
          fi
          git commit -m "chore: update docs/briefing.json"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing and retrying..."
            git pull --rebase -X ours origin main
            sleep 3
          done
          echo "push failed after 5 attempts"
          exit 1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bots-output-${{ github.run_id }}
          path: public/

      - name: Report failure
        if: ${{ failure() }}
        run: echo "Bots workflow failed"
