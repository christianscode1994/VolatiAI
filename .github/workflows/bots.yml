name: VolatiAI Bots

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # manual trigger

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run X bot
        run: python VolatiAI/bots/x_bot.py

      - name: Run Reddit bot
        run: python VolatiAI/bots/reddit_bot.py

      - name: Run Substack bot
        run: python VolatiAI/bots/substack_bot.py

      - name: Run Telegram bot
        run: python VolatiAI/bots/telegram_bot.py

      - name: Run WhatsApp bot
        run: python VolatiAI/bots/whatsapp_bot.py

      - name: Run Slack bot
        run: python VolatiAI/bots/slack_bot.py
