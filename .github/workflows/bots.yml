name: VolatiAI Bots

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: volatiai-bots
  cancel-in-progress: true

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run VolatiAI Engine
        run: python3 -m src.main

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bots-output-${{ github.run_id }}
          path: public/

      - name: Report failure
        if: ${{ failure() }}
        run: echo "Bots workflow failed @ ${{ github.sha }}"
