name: VolatiAI Autonomous Signal Engine

on:
  schedule:
    # Runs every 5 minutes — adjust as you like
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  run-signal-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run autonomous signal engine
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
          NOSTR_RELAYS: ${{ secrets.NOSTR_RELAYS }}

          # Signal APIs
          VOLATILITY_API_URL: ${{ secrets.VOLATILITY_API_URL }}
          SENTIMENT_API_URL: ${{ secrets.SENTIMENT_API_URL }}
          DEV_ACTIVITY_API_URL: ${{ secrets.DEV_ACTIVITY_API_URL }}
          DEPTH_API_URL: ${{ secrets.DEPTH_API_URL }}

          # Thresholds
          VOLATILITY_THRESHOLD: ${{ secrets.VOLATILITY_THRESHOLD }}
          SENTIMENT_POS_THRESHOLD: ${{ secrets.SENTIMENT_POS_THRESHOLD }}
          SENTIMENT_NEG_THRESHOLD: ${{ secrets.SENTIMENT_NEG_THRESHOLD }}
          DEV_ACTIVITY_THRESHOLD: ${{ secrets.DEV_ACTIVITY_THRESHOLD }}
          DEPTH_THRESHOLD: ${{ secrets.DEPTH_THRESHOLD }}

          # Multi-signal batching flags
          BATCHING_ENABLED: "true"
          MAX_BATCH_SIZE: "20"

        run: node workflows/signal_broadcast.js
