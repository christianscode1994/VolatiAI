name: Canary - snapshot freshness
on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 4h after daily-snapshot
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check today's snapshot exists
        id: snap
        run: |
          DATE=$(date -u +%Y-%m-%d)
          URL="https://christianscode1994.github.io/VolatiAI/snapshots/${DATE}.json"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL?cb=$(date +%s)")
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "code=$code" >> $GITHUB_OUTPUT
          if [ "$code" != "200" ]; then
            echo "::error::No snapshot for $DATE (HTTP $code)"
            exit 1
          fi
          echo "✓ snapshot for $DATE present"

      - name: Check today's anchor exists
        id: anchor
        if: steps.snap.outcome == 'success'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          URL="https://christianscode1994.github.io/VolatiAI/snapshots/${DATE}.json.tsr"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL?cb=$(date +%s)")
          if [ "$code" != "200" ]; then
            echo "::error::No .tsr anchor for $DATE (HTTP $code) — anchor step may have failed"
            exit 1
          fi
          echo "✓ anchor for $DATE present"

      - name: Full system verification (verify-all.sh)
        id: verify
        continue-on-error: true
        run: |
          chmod +x scripts/verify-all.sh
          ./scripts/verify-all.sh

      - name: Open issue on failure
        if: failure() || steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Canary: no snapshot/anchor for ${date}`,
              body: `The daily snapshot pipeline may have failed for **${date}**.\n\nCheck [daily-snapshot.yml run history](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/daily-snapshot.yml).\n\nThis canary runs at 10:00 UTC (4h after the snapshot cron). If you see this issue and the snapshot now exists, the cron was just late — close the issue.`
            });
