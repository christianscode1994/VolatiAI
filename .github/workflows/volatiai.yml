name: VolatiAI Agents

on:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: volatiai-agents
  cancel-in-progress: true

jobs:
  run-agents:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: pip install -r requirements.txt

      # Agents
      - run: python agents/market_agent/policy.py
      - run: python agents/sentiment_agent/policy.py
      - run: python agents/developer_agent/policy.py

      # Scoring
      - run: python src/scoring/fusion_scores.py

      # Fusion
      - run: python src/fuse.py

      # Intelligence modules
      - run: python src/intel/trends.py
      - run: python src/intel/narratives.py
      - run: python src/intel/microstructure.py
      - run: python src/intel/rpc_truth.py

      # Dashboards
      - run: python src/dashboard/html_builder.py

      # Telegram bot
      - run: python src/telegram/bot.py

      # Alerts
      - run: python src/alerts/whale_alerts.py
      - run: python src/alerts/spoofing_alerts.py
      - run: python src/alerts/trend_accel_alerts.py
      - run: python src/alerts/narrative_alerts.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agents-output-${{ github.run_id }}
          path: |
            public/
            private/
            agents/*/memory.json

      - name: Commit results
        run: |
          git config user.name "VolatiAI Bot"
          git config user.email "bot@volatiai.local"
          git add public private docs agents/*/memory.json
          git commit -m "VolatiAI: update agent outputs" || echo "No changes"
          git push

      - name: Report failure
        if: ${{ failure() }}
        run: echo "Agents workflow failed @ ${{ github.sha }}"
