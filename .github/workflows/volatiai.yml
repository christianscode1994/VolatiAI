# -------------------------
# Upload artifacts
# -------------------------

- name: Upload artifacts
  uses: actions/upload-artifact@v4
  with:
    name: agents-output-${{ github.run_id }}
    path: |
      public/
      agents/*/memory.json

# -------------------------
# Commit results
# -------------------------

- name: Commit results
  run: |
    git config user.name "VolatiAI Bot"
    git config user.email "bot@volatiai.local"
    git add public docs agents/*/memory.json
    git commit -m "VolatiAI: update agent outputs" || echo "No changes"
    git push
