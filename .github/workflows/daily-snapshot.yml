name: Daily sector snapshot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: volatiai-main-writer
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: npm audit (fail on high/critical)
        run: |
          npm ci --omit=dev || npm install --omit=dev
          npm audit --audit-level=high

      - name: Install crypto
        run: pip install cryptography

      - name: Run snapshot
        id: snapshot
        env:
          VOLATIAI_PRIVKEY: ${{ secrets.VOLATIAI_SIGNING_KEY }}
        run: python3 scripts/daily_snapshot.py
        continue-on-error: true

      - name: Publish pubkey to .well-known
        run: |
          mkdir -p docs/.well-known
          cp docs/pubkey.pem docs/.well-known/volatiai-pubkey.pem

      - name: Publish ops report
        env:
          VOLATIAI_PRIVKEY: ${{ secrets.VOLATIAI_SIGNING_KEY }}
        run: python3 scripts/publish_ops_report.py

      - name: Generate active signals
        run: python3 scripts/active_signals.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/snapshots/ docs/active.json docs/active.txt docs/current.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "Push succeeded (attempt $i)"
                exit 0
              fi
              echo "Push rejected, rebasing (attempt $i)"
              git pull --rebase origin main
              sleep $((i * 10))
            done
            echo "Push failed after 5 attempts"
            exit 1
          fi

      - name: Fail on regressions
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "Regressions detected — see run log above"
          exit 1
