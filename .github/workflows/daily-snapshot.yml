name: Daily sector snapshot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: volatiai-main-writer
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: npm audit (warn only — see notes)
        continue-on-error: true
        run: |
          npm ci --omit=dev || npm install --omit=dev
          npm audit --audit-level=high || echo "::warning::npm audit reported vulnerabilities — non-blocking, see workflow comments"

      # NOTE: npm audit was originally blocking. It broke every daily run
      # starting 2026-11-10 due to @atproto transitive vulns (23 found, 2 critical).
      # We made it non-blocking so the snapshot pipeline isn't hostage to a
      # dependency we don't control. Fix the underlying deps in a separate PR:
      # either update @atproto packages, or remove the sector that requires them.

      - name: Install crypto
        run: pip install cryptography

      - name: Guard against manual re-dispatch for existing date
        if: github.event_name == 'workflow_dispatch'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          if [ -f "docs/snapshots/${DATE}.json" ]; then
            echo "::error::Snapshot for ${DATE} already exists."
            echo "Manual re-dispatch for the current date is forbidden —"
            echo "it regenerates the file, invalidating the anchor entry"
            echo "and .tsr timestamp. This is the exact failure mode that"
            echo "caused the 12262e15 incident (see commit ca845c34)."
            echo "Use git log to inspect past runs. Let the 06:00 UTC cron"
            echo "generate fresh dates — do not force a re-run."
            exit 1
          fi
          echo "✅ No snapshot for ${DATE} yet — dispatch is safe"

      - name: Run snapshot
        id: snapshot
        env:
          VOLATIAI_PRIVKEY: ${{ secrets.VOLATIAI_SIGNING_KEY }}
        run: python3 scripts/daily_snapshot.py
        continue-on-error: true

      - name: Publish pubkey to .well-known
        run: |
          mkdir -p docs/.well-known
          cp docs/pubkey.pem docs/.well-known/volatiai-pubkey.pem

      - name: Sync pubkey
        env:
          VOLATIAI_PRIVKEY: ${{ secrets.VOLATIAI_SIGNING_KEY }}
        run: python3 scripts/sync_pubkey.py

      - name: Publish ops report
        env:
          VOLATIAI_PRIVKEY: ${{ secrets.VOLATIAI_SIGNING_KEY }}
        run: python3 scripts/publish_ops_report.py

      - name: Generate active signals
        run: python3 scripts/active_signals.py

      - name: Compute accuracy (writes docs/accuracy.json)
        run: python3 scripts/mirror/accuracy_tracker.py
        continue-on-error: true

      - name: Compute trust scores (writes docs/active_with_trust.json)
        run: python3 scripts/mirror/compute_trust_scores.py

      - name: Verify identity consistency (did.json vs pubkey*.pem vs signed snapshots)
        run: python3 scripts/mirror/verify_identity_consistency.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/snapshots/ docs/active.json docs/active.txt docs/active_with_trust.json docs/accuracy.json docs/current.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "Push succeeded (attempt $i)"
                exit 0
              fi
              echo "Push rejected, rebasing (attempt $i)"
              git pull --rebase origin main
              sleep $((i * 10))
            done
            echo "Push failed after 5 attempts"
            exit 1
          fi

      - name: Anchor snapshot (RFC 3161 timestamp + append to _anchors.jsonl)
        if: steps.snapshot.outcome == 'success'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SNAP="docs/snapshots/${DATE}.json"
          if [ ! -f "$SNAP" ]; then
            echo "⚠️  no snapshot for $DATE — skipping anchor"
            exit 0
          fi
          python3 scripts/mirror/anchor_snapshot.py "$DATE"
          # Also mirror pubkey to .well-known if it changed this run
          cp docs/pubkey.pem docs/.well-known/volatiai-pubkey.pem
          cp docs/pubkey-v0.pem docs/.well-known/volatiai-pubkey-v0.pem 2>/dev/null || true
          # Commit anchor artifacts separately (append-only log + .tsr)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/snapshots/_anchors.jsonl "docs/snapshots/${DATE}.json.tsr" docs/.well-known/
          if git diff --cached --quiet; then
            echo "No anchor changes to commit"
          else
            git commit -m "anchors: ${DATE} [skip ci]"
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "Anchor push succeeded (attempt $i)"
                exit 0
              fi
              echo "Anchor push rejected, rebasing (attempt $i)"
              git pull --rebase origin main
              sleep $((i * 10))
            done
            echo "Anchor push failed after 5 attempts"
            exit 1
          fi

      - name: OpenTimestamps stamp of anchor log
        if: always()
        continue-on-error: true
        run: |
          # FreeTSA already provides per-snapshot RFC 3161 timestamps.
          # OTS is a second independent witness for the *anchor log as a whole*
          # — Bitcoin-attested, aggregates the entire file into one digest.
          pip install --quiet opentimestamps-client 2>&1 | tail -1 || true
          if command -v ots >/dev/null 2>&1; then
            ots stamp docs/snapshots/_anchors.jsonl 2>&1 || true
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/snapshots/_anchors.jsonl.ots 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "anchors: OpenTimestamps stamp $(date -u +%Y-%m-%d) [skip ci]"
              git push origin main || true
            fi
          else
            echo "⚠ ots not available — skipping (FreeTSA .tsr cover is sufficient)"
          fi

      - name: Fail on regressions
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "Regressions detected — see run log above"
          exit 1
