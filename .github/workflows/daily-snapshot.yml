name: Daily sector snapshot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run snapshot
        id: snapshot
        run: python3 scripts/daily_snapshot.py
        continue-on-error: true

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Fail on regressions
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "Regressions detected — see run log above"
          exit 1
