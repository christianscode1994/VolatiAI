name: VolatiAI Engine

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VolatiAI engine
        run: python -m src.main

      - name: Copy output to docs
        run: |
          cp public/latest.json docs/latest.json
          cp public/summary.html docs/summary.html

      - name: Commit updated docs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/latest.json docs/summary.html
          git commit -m "Update public dashboard & API" || echo "No changes"

      - name: Push changes
        run: git push
