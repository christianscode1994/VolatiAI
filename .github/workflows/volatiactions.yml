name: VolatiAI Engine

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: volatiai-engine
  cancel-in-progress: true

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Add src to PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/src" >> $GITHUB_ENV

      - name: Run VolatiAI engine
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_ETH_RPC: ${{ secrets.PUBLIC_ETH_RPC }}
          PUBLIC_AVAX_RPC: ${{ secrets.PUBLIC_AVAX_RPC }}
          PUBLIC_BSC_RPC: ${{ secrets.PUBLIC_BSC_RPC }}
          PUBLIC_POLYGON_RPC: ${{ secrets.PUBLIC_POLYGON_RPC }}
          PUBLIC_SOLANA_RPC: ${{ secrets.PUBLIC_SOLANA_RPC }}
          ALCHEMY_URL: ${{ secrets.ALCHEMY_URL }}
          INFURA_URL: ${{ secrets.INFURA_URL }}
        run: python -m src.main

      - name: Persist briefing
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/briefing.json
          if git diff --staged --quiet; then
            echo "no changes to briefing.json"
            exit 0
          fi
          git commit -m "chore: update docs/briefing.json"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing and retrying..."
            git pull --rebase -X ours origin main
            sleep 3
          done
          echo "push failed after 5 attempts"
          exit 1
      - name: Run alerts
        run: python -m src.alerts

      - name: Copy output to docs
        run: |
          cp public/latest.json docs/latest.json
          cp public/summary.html docs/summary.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-output-${{ github.run_id }}
          path: |
            public/
            docs/
            history/

      - name: Commit updated docs & history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/latest.json docs/summary.html history
          git commit -m "Update dashboard, API & history snapshots" || echo "No changes"
          git push

      - name: Report failure
        if: ${{ failure() }}
        run: echo "Engine workflow failed @ ${{ github.sha }}"
