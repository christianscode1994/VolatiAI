name: VolatiAI Engine

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: volatiai-engine
  cancel-in-progress: true

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Add src to PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)/src" >> $GITHUB_ENV

      - name: Run VolatiAI engine
        run: python -m src.main

      - name: Run alerts
        run: python -m src.alerts

      - name: Copy output to docs
        run: |
          cp public/latest.json docs/latest.json
          cp public/summary.html docs/summary.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-output-${{ github.run_id }}
          path: |
            public/
            docs/
            history/

      - name: Commit updated docs & history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/latest.json docs/summary.html history
          git commit -m "Update dashboard, API & history snapshots" || echo "No changes"
          git push

      - name: Report failure
        if: ${{ failure() }}
        run: echo "Engine workflow failed @ ${{ github.sha }}"
