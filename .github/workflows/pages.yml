name: Deploy VolatiAI Dashboards to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: volatiai-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run local runner (generate dashboards)
        run: node local_runner/index.js

      - name: Regenerate checksums after runner

        run: python3 scripts/generate_checksums.py


      - name: Create docs folder
        run: mkdir -p docs && cp public/attribution.json docs/ 2>/dev/null || true && cp public/privacy.html docs/ 2>/dev/null || true && cp public/terms.html docs/ 2>/dev/null || true && cp public/identity.json docs/ 2>/dev/null || true && cp public/verify.html docs/ 2>/dev/null || true && cp public/intel.json.sha256 docs/ 2>/dev/null || true && cp public/attribution.json.sha256 docs/ 2>/dev/null || true

      - name: Copy public outputs to docs
        run: |
          cp -f public/*.json docs/ 2>/dev/null || true
          cp -f public/*.html docs/ 2>/dev/null || true

      - name: File Size Report
        run: |
          echo "=== DOCS FILE SIZES ==="
          find docs -type f -exec du -h {} + | sort -hr

          echo ""
          echo "=== TOP 20 LARGEST FILES ==="
          find . -type f -exec du -h {} + | sort -hr | head -20

      - name: Inspect Intel Files
        run: |
          echo "=== INTEL FILES ==="
          ls -lh docs/intel* || true

          echo ""
          echo "=== INTEL LINE COUNTS ==="
          wc -l docs/intel.json docs/intel.html || true

          echo ""
          echo "=== INTEL BYTE COUNTS ==="
          wc -c docs/intel.json docs/intel.html || true

      - name: Remove Oversized Intel Files
        run: |
          LIMIT=$((95 * 1024 * 1024))

          for file in docs/intel.json docs/intel.html
          do
            if [ -f "$file" ]; then
              SIZE=$(stat -c%s "$file")

              echo "$file size: $SIZE bytes"

              if [ "$SIZE" -gt "$LIMIT" ]; then
                echo "Removing oversized file: $file"
                rm -f "$file"
              fi
            fi
          done

      - name: Validate GitHub Limits
        run: |
          LARGE=$(find docs -type f -size +95M)

          if [ -n "$LARGE" ]; then
            echo "ERROR: Files exceed GitHub limit:"
            echo "$LARGE"
            exit 1
          fi

      - name: Final File Listing
        run: |
          echo "=== FINAL DOCS CONTENTS ==="
          ls -lah docs

      - name: Debug Git Status
        run: |
          echo "=== GIT STATUS ==="
          git status

          echo ""
          echo "=== MODIFIED FILES ==="
          git diff --name-only || true

          echo ""
          echo "=== UNTRACKED FILES ==="
          git ls-files --others --exclude-standard || true

      - name: Commit and Push Updated Docs
        run: |
          git config user.name "volati-bot"
          git config user.email "bot@example.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "[skip ci] Update VolatiAI public dashboards"

          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish:
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub 
