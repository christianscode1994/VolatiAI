name: Deploy VolatiAI Dashboards to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run local runner (generate dashboards)
        run: node local_runner/index.js

      - name: Copy public outputs to docs
        run: |
          cp public/*.json docs/
          cp public/*.html docs/

      - name: Commit updated docs
        run: |
          git config user.name "volati-bot"
          git config user.email "bot@example.com"
          git add docs/*.json docs/*.html
          git commit -m "Update VolatiAI public dashboards" || echo "No changes"
          git push

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publish
        uses: actions/deploy-pages@v4
