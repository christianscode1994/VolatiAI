name: Deploy VolatiAI Dashboards to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run local runner (generate dashboards)
        run: node local_runner/index.js

      - name: Verify generated files
        run: |
          pwd
          ls -la
          ls -la public || true

      - name: Create docs folder
        run: mkdir -p docs

      - name: Copy public outputs to docs
        run: |
          cp -f public/*.json docs/ || true
          cp -f public/*.html docs/ || true

      - name: File Size Report
        run: |
          echo "=== DOCS FILE SIZES ==="
          find docs -type f -exec du -h {} + | sort -hr

          echo ""
          echo "=== LARGEST FILES IN REPO ==="
          find . -type f -exec du -h {} + | sort -hr | head -20

      - name: Inspect Intel Files
        run: |
          echo "=== INTEL FILES ==="
          ls -lh docs/intel* || true

          echo ""
          echo "=== INTEL LINE COUNTS ==="
          wc -l docs/intel.json docs/intel.html || true

          echo ""
          echo "=== INTEL FILE BYTE COUNTS ==="
          wc -c docs/intel.json docs/intel.html || true

      - name: Validate GitHub Limits
        run: |
          LARGE=$(find docs -type f -size +95M)

          if [ -n "$LARGE" ]; then
            echo "ERROR: Files exceed GitHub safe limit:"
            echo "$LARGE"
            exit 1
          fi

      - name: Commit updated docs
        run: |
          git config user.name "volati-bot"
          git config user.email "bot@example.com"

          git add docs

          git commit -m "[skip ci] Update VolatiAI public dashboards" || echo "No changes"

          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish:
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
