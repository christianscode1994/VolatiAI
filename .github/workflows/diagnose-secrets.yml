name: Diagnose Bot Secrets

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret formats
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          MAS_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MAS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          NOSTR_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
          NOSTR_RELAY: ${{ secrets.NOSTR_RELAY }}
        run: |
          check() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then
              echo "❌ $name: EMPTY"
              return
            fi
            local len=${#val}
            local first=$(printf '%s' "$val" | head -c 4 | sed 's/[0-9a-zA-Z]/x/g')
            local has_bot_prefix=$(printf '%s' "$val" | grep -q '^bot' && echo "YES — remove 'bot' prefix" || echo "no")
            local has_https=$(printf '%s' "$val" | grep -q '^https\?://' && echo "YES — remove protocol" || echo "no")
            local has_slash=$(printf '%s' "$val" | grep -q '/$' && echo "YES — remove trailing slash" || echo "no")
            local has_whitespace=$(printf '%s' "$val" | grep -qE '\s' && echo "YES — has spaces" || echo "no")
            echo "✓ $name: length=$len, first4=$first, bot_prefix=$has_bot_prefix, https=$has_https, trailing_slash=$has_slash, whitespace=$has_whitespace"
          }
          check "TELEGRAM_BOT_TOKEN" "$TG_TOKEN"
          check "TELEGRAM_CHAT_ID" "$TG_CHAT"
          check "MASTODON_INSTANCE" "$MAS_INSTANCE"
          check "MASTODON_ACCESS_TOKEN" "$MAS_TOKEN"
          check "NOSTR_PRIVATE_KEY" "$NOSTR_KEY"
          check "NOSTR_RELAY" "$NOSTR_RELAY"

      - name: Test Telegram API directly
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "skip: empty"; exit 0; fi
          echo "Testing GET /getMe (just validates the token):"
          curl -sS -o /tmp/resp -w "HTTP %{http_code}\n" \
            "https://api.telegram.org/bot${TOKEN}/getMe"
          head -c 300 /tmp/resp; echo

      - name: Test Mastodon API directly
        if: always()
        env:
          INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          if [ -z "$INSTANCE" ] || [ -z "$TOKEN" ]; then echo "skip: empty"; exit 0; fi
          echo "Testing /api/v1/accounts/verify_credentials:"
          curl -sS -o /tmp/resp2 -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://${INSTANCE}/api/v1/accounts/verify_credentials"
          head -c 300 /tmp/resp2; echo
