name: Platform Health

on:

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:

  health:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run Health Check
        run: node health/healthcheck.js
