name: Signal Notifier

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 (offset from bots.yml at :00 and publish.yml at :00)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Notify new high-severity signals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/signal_notifier.py

      - name: Commit notify state
        run: |
          if [ -z "$(git status --porcelain .signal-notify-state.json)" ]; then
            echo "no state change"
            exit 0
          fi
          git config user.name "VolatiAI Bot"
          git config user.email "bot@volatiai.local"
          git add .signal-notify-state.json
          git commit -m "chore: update signal notify state [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            git pull --rebase origin main
            sleep 3
          done
          echo "push failed after 3 attempts"
