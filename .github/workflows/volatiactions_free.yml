name: VolatiAI Free Tier

on:
  schedule:
    - cron: "0 * * * *"   # every 60 minutes
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VolatiAI engine (Free)
        run: python -m src.main --tier free

      - name: Copy output to docs
        run: |
          cp public/latest.json docs/latest_free.json
          cp public/summary.html docs/summary_free.html

      - name: Commit updated docs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/latest_free.json docs/summary_free.html
          git commit -m "Update Free Tier data" || echo "No changes"

      - name: Push changes
        run: git push
