name: VolatiAI Engine

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    env:
      INFURA_URL: ${{ secrets.INFURA_URL }}
      ALCHEMY_URL: ${{ secrets.ALCHEMY_URL }}
      INFURA_GAS_URL: ${{ secrets.INFURA_GAS_URL }}

      PUBLIC_ETH_RPC: ${{ secrets.PUBLIC_ETH_RPC }}
      PUBLIC_POLYGON_RPC: ${{ secrets.PUBLIC_POLYGON_RPC }}
      PUBLIC_BSC_RPC: ${{ secrets.PUBLIC_BSC_RPC }}
      PUBLIC_AVAX_RPC: ${{ secrets.PUBLIC_AVAX_RPC }}
      PUBLIC_SOLANA_RPC: ${{ secrets.PUBLIC_SOLANA_RPC }}

      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

      PYTHONPATH: :${{ github.workspace }}/src

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VolatiAI engine
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_ETH_RPC: ${{ secrets.PUBLIC_ETH_RPC }}
          PUBLIC_AVAX_RPC: ${{ secrets.PUBLIC_AVAX_RPC }}
          PUBLIC_BSC_RPC: ${{ secrets.PUBLIC_BSC_RPC }}
          PUBLIC_POLYGON_RPC: ${{ secrets.PUBLIC_POLYGON_RPC }}
          PUBLIC_SOLANA_RPC: ${{ secrets.PUBLIC_SOLANA_RPC }}
          ALCHEMY_URL: ${{ secrets.ALCHEMY_URL }}
          INFURA_URL: ${{ secrets.INFURA_URL }}
        run: python -m src.main

      - name: Copy output to docs
        run: |
          cp public/latest.json docs/latest.json
          cp public/summary.html docs/summary.html

      - name: Commit updated docs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/latest.json docs/summary.html history docs/briefing.json
          git commit -m "Update public dashboard & API" || echo "No changes"

      - name: Push changes
        run: |
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing and retrying..."
            git pull --rebase -X ours origin main
            sleep 3
          done
          echo "push failed after 5 attempts"
          exit 1
