<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VolatiAI · Sector Volatility Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #020617;
      color: #e5e7eb;
      padding: 20px;
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p { font-size: 13px; color: #9ca3af; }
    canvas {
      width: 100%;
      max-width: 480px;
      height: 480px;
      margin-top: 20px;
      background: #0b1120;
      border-radius: 12px;
      border: 1px solid #1f2937;
    }
  </style>
</head>
<body>
  <h1>Sector Volatility Radar</h1>
  <p>Static, serverless radar chart computed from <code>sector_reliability.json</code>.</p>

  <canvas id="radar"></canvas>

  <script>
    async function load() {
      const res = await fetch("sector_reliability.json");
      const data = await res.json();

      const sectors = data.sectorReliability.map(s => s.sector);
      const values = data.sectorReliability.map(s => s.avgReliability);

      const canvas = document.getElementById("radar");
      const ctx = canvas.getContext("2d");

      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = Math.min(w, h) * 0.35;

      ctx.clearRect(0, 0, w, h);

      ctx.strokeStyle = "#1f2937";
      ctx.lineWidth = 1;

      for (let r = radius; r > 0; r -= radius / 4) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      const angleStep = (Math.PI * 2) / sectors.length;

      ctx.strokeStyle = "#22c55e";
      ctx.fillStyle = "rgba(34,197,94,0.25)";
      ctx.lineWidth = 2;

      ctx.beginPath();
      sectors.forEach((sector, i) => {
        const angle = i * angleStep - Math.PI / 2;
        const value = values[i];
        const r = radius * value;

        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#e5e7eb";
      ctx.font = "12px system-ui";

      sectors.forEach((sector, i) => {
        const angle = i * angleStep - Math.PI / 2;
        const x = cx + (radius + 20) * Math.cos(angle);
        const y = cy + (radius + 20) * Math.sin(angle);
        ctx.fillText(sector, x - 20, y);
      });
    }

    load();
  </script>
</body>
</html>
