<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="60" rx="10" fill="#0f172a"/>

  <text x="20" y="35" font-family="Arial" font-size="28" fill="#38bdf8">Volati</text>
  <text x="110" y="35" font-family="Arial" font-size="28" fill="#a78bfa">AI</text>

  <!-- AI Node -->
  <circle cx="160" cy="30" r="8" fill="#38bdf8">
    <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- DePIN Node -->
  <circle cx="180" cy="30" r="8" fill="#a78bfa">
    <animate attributeName="r" values="8;10;8" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
