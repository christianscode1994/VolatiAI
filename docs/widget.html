<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin:0; font-family:system-ui; background:#0b1120; color:#e5e7eb; }
    .widget {
      padding:10px 14px;
      border-radius:12px;
      border:1px solid #1f2937;
      background:#111827;
      width:260px;
    }
    .title { font-size:14px; margin-bottom:6px; }
    .status { font-size:12px; color:#9ca3af; }
    .dot {
      width:10px; height:10px; border-radius:999px;
      background:#22c55e; display:inline-block; margin-right:6px;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="title">VolatiAI Status</div>
    <div class="status"><span class="dot"></span><span id="statusText">Loading…</span></div>
  </div>

  <script>
    async function loadStatus() {
      try {
        const r = await fetch("reliability.json");
        const j = await r.json();
        const s = j.avgReliability;

        const el = document.getElementById("statusText");

        if (s >= 0.8) el.textContent = "All systems operational";
        else if (s >= 0.5) el.textContent = "Partial degradation";
        else el.textContent = "Major outage";
      } catch {
        document.getElementById("statusText").textContent = "Unavailable";
      }
    }

    loadStatus();
    setInterval(loadStatus, 30000);
  </script>
</body>
</html>
